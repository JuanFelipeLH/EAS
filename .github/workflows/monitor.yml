name: nuclear-monitor

on:
  schedule:
    # Fallback: GitHub's built-in cron is unreliable at 5-min intervals.
    # Primary trigger is cron-job.org via workflow_dispatch (see README).
    - cron: "0 * * * *"
  # Primary trigger — called every 5 min by cron-job.org via GitHub API
  workflow_dispatch:

# If a run is in progress, queue the next one instead of cancelling it.
# At most 1 running + 1 queued will exist at any time.
concurrency:
  group: nuclear-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Hard limit: kill the job if it exceeds 4 minutes so it never blocks the next run
    timeout-minutes: 4

    # Write permission is required to push status.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch full history so git push works correctly
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run nuclear monitor
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node src/monitor.js

      - name: Commit and push status update
        run: |
          git config --global user.name "nuclear-monitor-bot"
          git config --global user.email "bot@nuclear-monitor.local"
          git add data/status.json data/history.json data/processing_log.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update status [skip ci]"
          git push
